<div class="menu-grid">
    @for (item of items(); track item.id) {
        <app-menu-card 
            [item]="item"
            (itemSelected)="onItemSelected($event)" 
            [selectedId]="selectedId()"       
        ></app-menu-card>
    } @empty {
        <p>No dishes available.</p>
    }
</div>
