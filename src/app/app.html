<header>
  <h1>{{ restaurantName }}</h1>
  <p>Fresh ingredients, delicious dishes.</p>
</header>

<main>
  <h2>Our Menu</h2>

  <app-menu-filters
    [categories]="categories"
    [selectedCategory]="selectedCategory()"
    (categorySelected)="selectCategory($event)"
    [searchText]="searchText()"
    (searchChanged)="updateSearch($event)"></app-menu-filters>
    
  <app-menu-list 
    [items]="filteredItems()"
    (itemSelected)="selectItem($event)"
    
  ></app-menu-list>

  @if (selectedItem(); as item) {
    <app-menu-details
    [item]="item"
    (closed)="closeDetails()"
    >
    </app-menu-details>
  }
</main>
