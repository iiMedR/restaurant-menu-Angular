<header>
  <h1>{{ restaurantName }}</h1>
  <p>Fresh ingredients, delicious dishes.</p>
</header>

<main>
  <h2>Our Menu</h2>

  <app-menu-filters
    [categories]="categories"
    [selectedCategory]="selectedCategory()"
    (categorySelected)="selectCategory($event)"></app-menu-filters>

  <app-menu-list [items]="filteredItems()"></app-menu-list>
</main>
